kind: pipeline
type: docker
name: default

trigger:
  event:
    - push
    - pull_request

steps:
  - name: validate-static-app
    image: node:22-alpine
    commands:
      - test -s index.html
      - test -s styles.css
      - test -s app.js
      - node --check app.js
      - node -e "const fs=require('node:fs'); const html=fs.readFileSync('index.html','utf8'); if (!/<link\\b[^>]*href=[\"'](?:\\.\\/)?(?:[^\"'?#]+\\/)*styles\\.css(?:[?#][^\"']*)?[\"'][^>]*>/i.test(html)) { throw new Error('Missing styles.css link'); } if (!/<script\\b[^>]*src=[\"'](?:\\.\\/)?(?:[^\"'?#]+\\/)*app\\.js(?:[?#][^\"']*)?[\"'][^>]*><\\/script>/i.test(html)) { throw new Error('Missing app.js script'); }"
